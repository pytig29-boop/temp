[project]
name = "btc-quant"
version = "0.1.0"
description = "BTC spot short-horizon quant research system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "pyyaml>=6",
    "tabulate>=0.9",
    "numba>=0.60",
    "scipy>=1.13",
    "websockets>=13",
]

[project.scripts]
btc-quant = "btc_quant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
