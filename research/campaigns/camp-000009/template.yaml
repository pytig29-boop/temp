name: c2b_vol_breakout_1h_screen
data:
  exchange: coinone
  symbol: BTC-KRW
  timeframe: 1m
  aux: []
bar_minutes: 60
signals:
- entry:
    block: donchian_breakout
    grid:
      lookback:
      - 24
      - 48
      - 144
  filters:
  - []
  - - block: vol_regime
      params:
        window: 24
        min_pct: 0.67
- entry:
    block: atr_channel_breakout
    grid:
      span:
      - 24
      mult:
      - 2.0
      - 3.0
  filters:
  - []
- entry:
    block: ema_slope
    grid:
      span:
      - 48
      min_slope_bp:
      - 3.0
      - 5.0
  filters:
  - []
  - - block: trend_regime_1h
      params:
        span: 168
study:
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 12
family: vol_breakout
hypothesis:
  text: On Coinone BTC-KRW at 1h decisions, upside breakouts of multi-day highs (donchian_breakout
    24/48/144 h), ATR-channel breakouts and persistent positive EMA slope (ema_slope
    span 48) are followed by 4-24 h returns above a matched (KST hour x vol) null,
    net of coinone_conservative cost; optionally only in high short-term vol (vol_regime
    0.67) or above the 1-week EMA (trend_regime_1h 168).
  rationale: 'Mechanism M3 (mechanisms.md) extended to multi-hour horizons: volatility
    clustering plus slow information diffusion and trend-following flows (CTA/retail
    momentum chasing, stop and short-liquidation cascades on derivatives venues spilling
    into KRW spot) make multi-day highs and persistent EMA slopes continue over 4-24
    h (time-series momentum). Counterparty: stop orders and liquidated shorts at breakout
    levels, counter-trend limit sellers who fade new highs, and late retail chasers
    we sell to on exit. Why it persists: forced liquidations are price-insensitive;
    trend capacity at hours horizon is large and crowded-out by nobody on a minor
    KRW venue. Kills it: long-only spot in bear regimes (2022), false breakouts in
    low vol, regime beta masquerading as signal (pitfall P-S6) - the matched (KST
    hour x vol) null removes unconditional drift only within the eligible pool. 5m
    version (camp-000003/6) was information-thin at 15-30 min (fact-000003, fact-000006,
    int-000004); re-examine condition ''decision interval changes'' is met (15m/1h/4h
    engine added 2026-11-09). Filters: vol_regime(24,0.67) tests the M3 high-vol story;
    trend_regime_1h(168) (1-week EMA) is the regime-filtered-trend variant (hypothesis
    c). Evidence exposure: fact-000003/6 Dev only (lockbox none, Val none); K-P0-4
    (lockbox+Val exposed) motivates the vol filter only, its value is the block default/grid
    value, not derived from it. Scope: Coinone BTC-KRW, decision 1h (and 4h screen),
    coinone_conservative primary cost, upbit_conservative grade cost; long only. [derived-from
    drv-000004 ← fact-000006; family vol_breakout]'
  success_criteria: 'Per config: BH q=0.10 over the family''s screen configs (incl.
    prior family screens), n_events >= 300, coinone_conservative net mean > 0 at the
    best primary horizon (bar-minute preset). Reported, not gating: upbit_conservative
    net (grade A/B) and per-year excess (pre-registered side calculation).'
