    and 2x TP, hold = information horizon 1440. Target Sharpe = screen z / sqrt(Dev
    years) = 3.30/sqrt(4.83) = 1.50, fixed before the power check.'
  success_criteria: G0-G6 under ruleset rs-003, robustness suite, per-asset results
    reported (XRP/ETH vs camp-000034).
