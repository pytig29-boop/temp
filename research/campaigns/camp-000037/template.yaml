name: r2d_liq_meanrev_trend_dip_4h_u3_screen
family: liq_meanrev
universe:
- BTC-KRW
- XRP-KRW
- ETH-KRW
data:
  exchange: coinone
  timeframe: 1m
  aux: []
bar_minutes: 240
signals:
- entry:
    block: bollinger_z_revert
    grid:
      window:
      - 24
      z:
      - 2.0
  filters:
  - - block: trend_ema_filter
      grid:
        span:
        - 90
        band_bp:
        - 0.0
- entry:
    block: rsi_oversold_bounce
    grid:
      period:
      - 14
      level:
      - 30
  filters:
  - - block: trend_ema_filter
      grid:
        span:
        - 90
        band_bp:
        - 0.0
study:
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 2
hypothesis:
  text: On the fixed Coinone universe [BTC-KRW, XRP-KRW, ETH-KRW] (D15, pooled, per-asset
    matched null) at 4h decisions, multi-day oversold dips (close >= 2 sd below the
    24-bar = 4-day mean, bollinger_z_revert(24,2.0), or RSI(14) <= 30 bounce) taken
    only while the asset is above its own 90-bar 4h EMA (experimental trend_ema_filter
    span 90 = 15 days; trend_regime_1h is invalid on 4h bars) are followed by 8-48
    h returns above the matched null, net of per-asset coinone_conservative cost.
  rationale: 'Autonomous program R2 track D. Mechanism M4 at multi-day horizon: pullbacks
    inside an established up-trend are partly liquidity/de-leveraging driven and revert
    as trend-following flows resume. Counterparty: leveraged longs flushed on pullbacks,
    short-term momentum sellers. Purpose: a diversifier whose entries occur when the
    vol_breakout candidate (camp-000034) is flat (it buys new highs; this buys dips).
    Kills: falling knives at regime turns (trend filter lags), 2022 bear (filter should
    mostly keep it out), small event count at 4h, prior liq_meanrev history (11 campaigns,
    15m/1h effects small and cost-eaten; 1h bollinger/rsi 0 of 5 passed, fact-000012)
    - this tests only the longer 4h horizon not yet screened. Evidence (Dev only;
    lockbox none, Val none): fact-000011 15m bollinger+trend24 net 6 bp; fact-000012
    1h NO_SIGNAL. Parameters are block-grid values fixed before data; span 90 chosen
    so a 2-sd dip below the 4-day mean can still sit above the trend line.'
  success_criteria: 'Per config: BH q=0.10 over the family''s screen configs (incl.
    prior liq_meanrev screens), pooled n_events >= 300, coinone_conservative net mean
    > 0 at the best primary horizon. Strategy campaign only on a passing config.'
