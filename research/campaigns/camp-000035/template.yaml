name: r2c_xasset_btc_lead_4h_u3_screen
data:
  exchange: coinone
  timeframe: 1m
  aux:
  - coinone_btc
bar_minutes: 240
signals:
- entry:
    block: donchian_breakout
    grid:
      lookback:
      - 48
  filters:
  - - block: btc_trend_filter
      grid:
        span:
        - 42
        - 90
        band_bp:
        - 0.0
study:
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 2
family: xasset_btc_lead
hypothesis:
  text: On the fixed Coinone universe [BTC-KRW, XRP-KRW, ETH-KRW] (pooled, per-asset
    matched null) at 4h decisions, donchian_breakout(48) entries taken only while
    Coinone BTC-KRW is in a 4h up-trend (close > EMA 42 or 90 bars = 7 or 15 days;
    experimental btc_trend_filter, aux coinone_btc) are followed by 8-48 h returns
    above the matched null, net of per-asset coinone_conservative cost.
  rationale: 'Autonomous program R2 track C. Mechanism: altcoins follow the BTC regime
    (common crypto factor); alt breakouts persist when the market leader trends up
    and fail when it does not. Counterparty: late trend chasers buying alt breakouts
    against a falling BTC. Kills: fewer events (filter), BTC sleeve identical to its
    own trend filter, regime concentration. Evidence (Dev only; lockbox none, Val
    none): camp-000034 skeptic review — XRP+ETH-only sub-portfolio Sharpe 1.06, XRP
    median trade -5 bp, 64% of XRP PnL in 5 trades; screen camp-000033 per-asset XRP
    p 0.149 (not significant). Entry fixed to the screened donchian 48; filter spans
    pre-declared block-grid values.'
  success_criteria: 'Per config: BH q=0.10 over the family''s screen configs, pooled
    n_events >= 300, coinone_conservative net mean > 0 at the best primary horizon.
    Reported: per-asset results (XRP/ETH vs unfiltered camp-000033).'
universe:
- BTC-KRW
- XRP-KRW
- ETH-KRW
