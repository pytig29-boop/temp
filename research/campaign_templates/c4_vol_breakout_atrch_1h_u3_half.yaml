hypothesis:
  text: 'Coinone 3-asset universe [BTC-KRW, XRP-KRW, ETH-KRW] (D15, pooled, equal sleeves), 1h: atr_channel_breakout(24,3)
    with half-size entries (entry_fraction 0.5) and ATR exits (SL 2 ATR x TP 1.5/3 ATR, max hold 480/960 min) earns positive
    per-asset coinone_conservative net MTM returns that pass G0-G5 on Dev and the robustness suite.'
  rationale: 'Mechanism M3 (1h time-series momentum; stop cascades, short liquidations, late trend followers). Counterparty:
    counter-trend limit sellers, stopped-out shorts, late chasers at exit. Kills: bear regimes (2022), per-asset cost (D17),
    drift confound (int-000009/int-000011), regime concentration. Structural change vs the paused BTC-only line: the fixed
    3-asset universe (D15) - same parameters, ~3x positions, pooled equal-sleeve evaluation. Caveat stated before the run:
    the BTC sleeve re-uses a rule family whose BTC-only versions carry taxonomy VAL_FAIL (fact-000013/fact-000016); a skeptic
    must weigh that the BTC sleeve is not new evidence. Partial sizing entry_fraction 0.5 (user request, D16): size does not
    change the edge gates (G2/G5) and halves drawdowns. Exits fixed by the pre-screen plan (scratchpad PLAN_prescreen.txt):
    sl_atr = screen MAE-p75 suggestion rounded to 0.5, tp_atr = {MFE-median suggestion rounded to 0.5, 2x}, max hold {info
    horizon 480, 960}. MTM gate returns (D18). Evidence (Dev only; lockbox none, Val none): screen camp-000027 (drv-000019):
    pooled n 3225 (BTC 1165, XRP 862, ETH 1198), p 0.0034, excess 21.8 bp z 3.06 @480 (peaked), net +23.5 bp (Upbit +10.7);
    MFE median 1.37 ATR, |MAE| p75 2.16 ATR (1h ATR median 0.86 %). Plausible Sharpe z/sqrt(4.83 y) = 1.39; required ~1.28
    (N_dsr ~12); target 1.35. Predicted failures: G2 (drift in the null), regime share, G4 recent, PBO. [derived-from drv-000022
    ← fact-000024; family vol_breakout]'
  success_criteria: At least one spec passes G0-G5, ablation, G6 (outcome code) and the Dev robustness suite. Refuted as a
    tradeable edge if no spec passes G2 or the best Dev Sharpe_w (MTM) < 1.0.
