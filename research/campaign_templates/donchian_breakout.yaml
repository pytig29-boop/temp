# 예시 캠페인 템플릿 — 돌파 계열. 형식: research/campaigns/README.md
name: donchian_breakout_v1
hypothesis:
  text: "코인원 BTC-KRW 5분봉에서 Donchian 채널 상향 돌파 후 1~4시간 동안 양의 기대수익이 있다(보수적 비용 차감 후)."
  rationale: "Phase 0: 1~2시간 보유 시 필요 승률 56~59%, 고변동성 국면에서 비용 부담 절반 → 돌파 + 변동성/추세 국면 필터가 비용을 넘을 여지."
  success_criteria: "≥1 스펙이 G0~G6 통과 (가중 일간 Sharpe, coinone_conservative). upbit_conservative 에서도 통과하면 A등급."
data:
  exchange: coinone
  symbol: BTC-KRW
  timeframe: 1m
  aux: []                       # 바이낸스 실시간 미확보 → 교차시장 블록 사용 안 함
entry:
  block: donchian_breakout
  grid: {lookback: [48, 96, 144, 288]}
filters:                        # 필터 세트 목록 ([] = 필터 없음), 세트당 0~2개
  - []
  - [{block: vol_regime, grid: {window: [24], min_pct: [0.33, 0.5, 0.67]}}]
  - [{block: trend_regime_1h, grid: {span: [24, 168]}}]
exits:
  sl_pct: [0.5, 0.8, 1.2]
  tp_pct: [0.6, 1.0, 1.5]
  max_hold_min: [60, 120, 240]
costs:
  primary: coinone_conservative
  grade: upbit_conservative
  stress: coinone_stress
  grade_stress: upbit_stress
budget: 700                     # 4 × (1+3+2) × 27 = 648 스펙
