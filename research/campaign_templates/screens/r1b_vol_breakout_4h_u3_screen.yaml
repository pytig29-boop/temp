# Autonomous program R1 track B (2026-11-12). Same configs as c2b_vol_breakout_4h_screen, pooled over 3 assets.
name: r1b_vol_breakout_4h_u3_screen
data:
  exchange: coinone
  timeframe: 1m
  aux: []
bar_minutes: 240
signals:
- entry:
    block: donchian_breakout
    grid:
      lookback:
      - 24
      - 48
  filters:
  - []
- entry:
    block: atr_channel_breakout
    grid:
      span:
      - 24
      mult:
      - 3.0
  filters:
  - []
- entry:
    block: ema_slope
    grid:
      span:
      - 24
      min_slope_bp:
      - 5.0
  filters:
  - []
study:
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 4
family: vol_breakout
hypothesis:
  text: On the fixed Coinone universe [BTC-KRW, XRP-KRW, ETH-KRW] (D15, pooled, per-asset
    matched null) at 4h decisions, the same pre-registered entries as the BTC-only
    4h screen camp-000013-era c2b (donchian_breakout 24/48, atr_channel_breakout(24,3),
    ema_slope(24,5bp)) are followed by 8-48 h returns above a matched (KST hour x
    vol) null, net of per-asset coinone_conservative cost (D17).
  rationale: 'Autonomous program R1 track B (docs/prompts/autonomous_research_plan.md
    §7.2). Mechanism M3 at multi-day horizons (time-series momentum; stop and short-liquidation
    cascades; trend-following flows). Counterparty: counter-trend limit sellers and
    liquidated shorts at breakout levels; late chasers on exit. Kills: long-only bear
    regimes (2022), regime beta (pooled per-asset matched null), XRP/ETH spreads (D17
    costs). Evidence (Dev only; lockbox none, Val none): BTC-only 4h screen passed
    all four configs (fact for hyp-000010: donchian 24 n=401 p=0.003, 48 n=303 p=0.001,
    atr_channel n=360 p=0.001, ema_slope n=2171 p=0.012), but a BTC-only 4h strategy
    was expected to fail G1 (<300 trades); pooling three assets (D15) is the structural
    change that makes a 4h campaign testable. Parameters are the earlier pre-registered
    values, not re-tuned.'
  success_criteria: 'Per config: BH q=0.10 over the family''s screen configs (incl.
    prior family screens), pooled n_events >= 300, coinone_conservative net mean >
    0 at the best primary horizon. Per-asset results reported only.'
universe:
- BTC-KRW
- XRP-KRW
- ETH-KRW
