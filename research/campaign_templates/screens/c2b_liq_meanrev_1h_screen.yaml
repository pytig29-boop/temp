    year.
  rationale: 'Mechanism M4 (mechanisms.md): forced liquidations / panic selling push KRW spot below fair value and partially
    rebound once the price-insensitive flow ends. Counterparty: force-liquidated levered longs and panic-selling retail; liquidity
    provision during cascades carries inventory risk most participants avoid. Kills it: information-driven drops, second-wave
    cascades, bear regimes. This re-examines the family at 15m/1h decisions (re-examine condition ''decision interval changes''
    in fact-000005/fact-000008) and explicitly tests int-000005 (unverified): that the 5m trend-filtered reversion is bull-regime
    dip buying concentrated in 2021 rather than liquidity-provision income. trend_regime_1h(168) (1-week EMA) is a slow bull-regime
    filter: the matched null is drawn from the same filtered pool, so a filter-only (regime beta) effect does not count as
    signal. Pre-registered diagnostic (side calculation, no ledger): for every passing config, per-calendar-year excess at
    the best primary horizon; int-000005 is supported at this timeframe if the excess is positive in fewer than 3 of the 5
    Dev years or one year carries > 50% of the summed excess. Evidence exposure: fact-000004/5/8 and the camp-000008 ad-hoc
    robustness are Dev only (lockbox none, Val none). Scope: Coinone BTC-KRW, decision 15m and 1h, coinone_conservative primary,
    upbit_conservative grade; long only. [derived-from drv-000007 ← fact-000008; family liq_meanrev]'
  success_criteria: 'Per config: BH q=0.10 over the family''s screen configs (incl. prior family screens), n_events >= 300,
    coinone_conservative net mean > 0 at the best primary horizon (bar-minute preset). Reported, not gating: upbit_conservative
    net (grade A/B) and per-year excess (pre-registered side calculation).'
