# Cycle 3C (2026-11-10) S3b — capitulation-volume reversion at 1h. Family liq_meanrev (inherited).
# Derived via lessons_derive_hypothesis (drv-000015 <- fact-000012); hypothesis block tagged by apply_derivation.
name: c3c_liq_meanrev_capvol_1h_screen
family: liq_meanrev
data:
  exchange: coinone
  symbol: BTC-KRW
  timeframe: 1m
  aux: []
bar_minutes: 60
signals:
- entry:
    block: bollinger_z_revert
    params:
      window: 24
      z: 2.5
  filters:
  - - block: volume_z
      params:
        window: 48
        min_z: 1.0
  - - block: volume_z
      params:
        window: 48
        min_z: 2.0
study:
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 2
hypothesis:
  text: On Coinone BTC-KRW at 1h decisions, closes >= 2.5 sd below the 24 h mean on abnormally high volume (volume_z(48) >=
    1 / >= 2 vs the trailing 2 days) are followed by 4-24 h returns above a matched (KST hour x vol) null, net of coinone_conservative
    cost, unlike the price-only 1h reversion that was NO_SIGNAL (camp-000012).
  rationale: 'Same mechanism M4 and counterparty as S3a (force-liquidated longs, panic sellers; volume spike as the cascade
    proxy named in mechanisms.md M4). At 1h a cascade bar is a larger, rarer dislocation; the question is whether volume confirmation
    isolates the forced-selling events whose reversion lasts hours, which price-only 1h dislocations did not show (fact-000012
    NO_SIGNAL, Dev, lockbox none, Val none). Kills: information-driven drops, second waves, bear regimes, bot-contaminated
    Coinone volume (P-D1). Expected weak a priori (fact-000012, int-000008 unverified). Strategy campaign only if a config
    passes and the plausible Sharpe clears the power requirement. Block-grid values only. [derived-from drv-000015 ← fact-000012;
    family liq_meanrev]'
  success_criteria: 'Per config: BH q=0.10 over the family''s screen configs, n_events >= 300, coinone_conservative net mean
    > 0 at the best primary horizon (240/480/1440).'
