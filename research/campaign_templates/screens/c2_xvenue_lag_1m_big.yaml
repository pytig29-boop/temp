name: c2_xvenue_lag_1m_big_screen
hypothesis:
  text: On Coinone 1m, only large Upbit impulses (upbit_lead_impulse thr_bp 40, k
    1/3, non-quiet KST hours) produce a Coinone catch-up larger than the 4 bp conservative
    round trip within 5-30 min.
  rationale: 'int-000001: the 1m lead is real (z 4-11) but per-event excess 1.3-2.9
    bp < cost; per-event excess grew with thr_bp (10->20) in camp-000001, so the next
    block-grid value (40) is the minimal test. Same mechanism M1, same family; trials
    accumulate. [derived-from drv-000001 ← fact-000001; family xvenue_upbit_lead]'
  success_criteria: BH q=0.10 over all family screen configs, n_events >= 300, coinone_conservative
    net mean > 0 at best primary horizon (5/15/30).
data:
  exchange: coinone
  symbol: BTC-KRW
  timeframe: 1m
  aux:
  - upbit
bar_minutes: 1
signals:
- entry:
    block: upbit_lead_impulse
    grid:
      k:
      - 1
      - 3
      thr_bp:
      - 40
  filters:
  - - block: session_kst
      params:
        session: all_but_quiet
study:
  horizons:
  - 1
  - 5
  - 15
  - 30
  - 60
  - 120
  primary_horizons:
  - 5
  - 15
  - 30
  min_gap_min: 30
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 2
family: xvenue_upbit_lead
