# Cycle 4 (2026-11-10) screen sbc. Derived via lessons_derive_hypothesis (drv-000019 <- fact-000009); family inherited (vol_breakout).
name: c4_vol_breakout_mom_1h_u3_screen
family: vol_breakout
universe:
- BTC-KRW
- XRP-KRW
- ETH-KRW
data:
  exchange: coinone
  timeframe: 1m
  aux: []
bar_minutes: 60
signals:
- entry:
    block: atr_channel_breakout
    params:
      span: 24
      mult: 3.0
  filters:
  - []
- entry:
    block: roc_threshold
    params:
      lookback: 12
      thr_bp: 100
  filters:
  - []
- entry:
    block: composite_z
    grid:
      preset:
      - momentum
      threshold:
      - 1.0
      - 1.5
  filters:
  - []
- entry:
    block: composite_z
    params:
      preset: volume_momentum
      threshold: 1.5
  filters:
  - []
study:
  n_null: 1000
  seed: 0
  min_events: 300
  stratify: hour_vol
costs:
  primary: coinone_conservative
  grade: upbit_conservative
correction:
  method: bh
  alpha: 0.1
budget: 5
hypothesis:
  text: On the fixed Coinone universe [BTC-KRW, XRP-KRW, ETH-KRW] (D15, pooled) at 1h decisions, upside momentum entries -
    atr_channel_breakout(24,3), roc_threshold(12,100) and the equal-weight composite scores composite_z momentum >= 1.0 /
    >= 1.5 and volume_momentum >= 1.5 - are followed by 4-24 h returns above a per-asset matched (KST hour x vol) null, net
    of per-asset coinone_conservative cost (D17).
  rationale: 'Mechanism M3 (mechanisms.md, time-series momentum / continuation at 1h): stop cascades, short liquidations and
    late trend followers extend multi-hour moves. Counterparty: counter-trend limit sellers, stopped-out shorts and late chasers
    we sell to at exit. Persists because liquidation flow is price-insensitive and Coinone is too thin for large arbitrageurs.
    What kills it: long-only bear regimes (2022), per-asset cost (D17), generic drift confound, and the fact that the BTC-only
    versions of the same entries topped out at Dev Sharpe_w ~0.9-1.15 on Dev; fact-000013 and fact-000016 carry taxonomy VAL_FAIL.
    Structural change that motivates a re-test (cycle 3C asked for one): the fixed 3-asset universe (D15) - same parameters,
    ~3x events and trades, pooled evaluation with equal sleeves, per-asset costs (D17); the BTC sleeve is a repeat of fact-000009/fact-000015
    configs, XRP/ETH sleeves are new data. Composite (cycle-4 B): composite_z momentum (r_12, r_48, chanpos_48) and volume_momentum
    (r_12, +log1p vol), equal weights, no fitted weights, block-grid thresholds only. Evidence (Dev only; lockbox none, Val
    none): fact-000009 (1h donchian/atr_channel BTC screen passed, info horizon 480-1440), fact-000015 (atr_channel(24,3)
    1h), fact-000017 (roc(12,100) 1h passed, excess 8.5 bp z 2.32 @480), int-000011 (volume timing adds little over drift),
    P-D1 (Coinone volume bot-contaminated). Nothing was computed on data before registration; all values are block-grid values
    or prior screened values. [derived-from drv-000019 ← fact-000009; family vol_breakout]'
  success_criteria: 'Per config: BH q=0.10 over the vol_breakout family screen set, pooled n_events >= 300, per-asset coinone_conservative
    net mean > 0 at the best primary horizon (240/480/1440). Pre-registered contrasts: (C) a 3-asset 1h momentum strategy
    campaign with partial sizing (entry_fraction 0.5) runs only for passing single-block configs (atr_channel_breakout / roc_threshold);
    (B) composite momentum is supported only if a composite config passes AND its excess at its best primary horizon exceeds
    the roc_threshold(12,100) sibling''s in this screen; otherwise no composite strategy campaign. Per-asset rows are report-only.'
