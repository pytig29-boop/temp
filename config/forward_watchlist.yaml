# Strategies listed here are OBSERVATION ONLY: they are not promoted (e.g. they failed G6), gates do not change,
# and watchlist status never implies promotion, risk sizing, or paper/live trading. The daily forward run
# (python -m btc_quant.research.forward run) tests them on genuinely unseen Forward data (after 2026-11-09) and
# records forward_results with state "watchlist". When Val is rolled (val cap reached -> new val_id from Forward
# data, a human edit of config/splits.yaml), a watchlisted strategy can be formally re-evaluated on that new Val.
