# PLAN §5.2 관문 / §5.3 잠금 / §7 리스크 공식 수치 (지금 고정. 변경은 사람만).
# 규약: 낙폭(MDD)은 양수 크기(0.20 = 20%), 손실 한도는 음수 수익률(-0.03 = -3%).
version: 1
primary_metric:
  half_life_days: 365          # D1/§2.2 반감기 12개월, Dev 끝 기준
  annualization: 365
  cost: conservative           # D3
G0:
  max_filters: 2
  max_params: 8                # 청산 3개 포함
G1:
  min_trades: 300
  min_recent_trades: 60        # Dev 최근 12개월
  recent_days: 365
G2:
  min_weighted_sharpe: 0.0     # 초과(>)
  null_runs: 1000              # 같은 필터·청산 + 무작위 진입
  null_top_fraction: 0.05      # 상위 5%: p = (1+#null>=obs)/(B+1) <= 0.05
G3:
  neighbor_median_ratio: 0.5   # 인접 조합 Sharpe 중앙값 >= 선택 조합의 50%
G4:
  rolling_window_days: 182     # 6개월
  rolling_step_days: 30
  min_rolling_positive_frac: 0.60
  min_recent_sharpe: 0.0       # 초과(>), 최근 12개월
  recent_days: 365
G5:
  min_dsr: 0.95                # 이상(>=)
  max_pbo: 0.30                # 미만(<)
  pbo_splits: 16
  cluster_threshold: 0.5       # 상관거리 sqrt((1-rho)/2) 절단 높이 (평균 rho >= 0.5 → 1 시도)
G6:
  min_sharpe: 0.0              # 초과(>), Val, conservative
  max_mdd: 0.20                # 이하(<=), primary(conservative) 비용 Val 최대낙폭 — 사용자 결정 2026-11-09 (b)
  min_stress_sharpe: 0.0       # 초과(>), stress 비용 Val Sharpe (stress 에서는 낙폭 크기 판정 안 함)
  max_stress_mdd: 0.20         # 구 규칙(legacy, float 입력 시에만 사용)
  max_mc_mdd95: 0.20           # 이하(<=), 거래당 몬테카를로 MDD 95백분위
  mc_sims: 10000
  # Val 사용 원장 + 누적 Holm (PLAN §10b-4, §5.3 잠금 규칙과 같은 구조). 후보마다 Val 평가 *전에*
  # 원장 val_evaluations 에 기록(k번째 사용). 통계량 = primary 비용 Val 일간 수익 평균 > 0 의
  # 정상 블록 부트스트랩 단측 p (inference.bootstrap_mean_test). 기존 G6 조건에 더해 이 p 가
  # 이 Val(val_id) 의 이전 모든 사용 p 와 함께 Holm(alpha, mode) 을 통과해야 G6 통과.
  # 같은 logic_hash 는 Val 을 한 번만 쓴다(재실행은 이전 결정 재사용). cap 회 사용 후 Val 롤링(사람).
  val_budget:
    alpha: 0.10
    holm_mode: cumulative      # G7 과 같은 의미 (cap: m=cap 고정 | cumulative: m=k)
    cap: 20                    # 20회 사용 시 Val 은퇴 → dev 편입, 새 Val 필요 (val_id 는 splits.yaml 의 val_id, 없으면 구간 경계로 생성)
    n_boot: 2000
    seed: 0
# 후보 선택 (PLAN §10b-4): 캠페인 수익 행렬의 상관 군집별 최고(primary 가중 Sharpe) 1개 → 그 중 상위 K.
selection:
  method: cluster_best         # cluster_best | top_sharpe(구 방식)
  cluster_threshold: 0.5       # selection.correlation_clusters 절단 높이 (G5 와 같은 값)
G7:
  alpha: 0.10
  cap: 10                      # 10회 개봉 시 잠금 구간 은퇴
  holm_mode: cumulative        # 사용자 결정 2026-11-09 (cap: 보수적, 수명 FWER<=alpha | cumulative: 개봉 수 기준 Holm)
G8:
  min_paper_weeks: 3
  min_paper_trades: 30
  pnl_band: 0.90               # 손익이 백테스트 90% 구간 안
  # 전진 인큐베이션 (research/forward.py, PLAN §10b-5)
  forward_states: [validated, challenger]
  forward_warmup_days: 14      # Forward 시작 후 이 기간은 지표 워밍업만(거래·평가 없음). 잠금 구간 데이터로 워밍업하지 않는다.
  forward_exchanges: [coinone, upbit]   # 매일 REST 로 Forward 1분봉을 저장소에 추가하는 거래소
risk:
  daily_loss_floor: -0.03      # min(-3%, Val 일간 1백분위)
  weekly_loss_floor: -0.06     # min(-6%, Val 주간 1백분위)
  drawdown_floor: -0.12        # min(-12%, -(MC MDD95 × 1.2))
  drawdown_mc_mult: 1.2
  loss_percentile: 1
  min_max_trades_per_day: 5    # max(5, 3 × 일평균)
  trades_per_day_mult: 3
  data_stall_minutes: 2
  api_error_streak: 3
  price_anomaly_quantile: 0.999
