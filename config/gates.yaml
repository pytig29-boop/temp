# PLAN §5.2 관문 / §5.3 잠금 / §7 리스크 공식 수치 (지금 고정. 변경은 사람만).
# 규약: 낙폭(MDD)은 양수 크기(0.20 = 20%), 손실 한도는 음수 수익률(-0.03 = -3%).
version: 1
primary_metric:
  half_life_days: 365          # D1/§2.2 반감기 12개월, Dev 끝 기준
  annualization: 365
  cost: conservative           # D3
# 관문 일간 수익 회계 (PLAN D18, class ② — config/params.yaml evaluation.daily_returns). realized = 청산일 귀속 실현 기준,
# mtm = 보유 분할을 매 UTC 일 종가에 청산 평가(평가 기준). 캠페인 등록 시점 값(gate_config_for_campaign)을 매니페스트
# `daily_returns` 에 고정 → G2~G6·몬테카를로·견고성·§7 한도가 그 회계. 변경 = class ② 승인, 다음 캠페인부터.
evaluation:
  daily_returns: mtm           # realized | mtm
G0:
  max_filters: 2
  max_params: 8                # 청산 3개 포함
G1:
  min_trades: 300
  min_recent_trades: 60        # Dev 최근 12개월
  recent_days: 365
G2:
  min_weighted_sharpe: 0.0     # 초과(>)
  null_runs: 1000              # 같은 필터·청산 + 무작위 진입
  null_top_fraction: 0.05      # 상위 5%: p = (1+#null>=obs)/(B+1) <= 0.05
G3:
  neighbor_median_ratio: 0.25  # 인접 조합 Sharpe 중앙값 >= 선택 조합의 50%
G4:
  rolling_window_days: 182     # 6개월
  rolling_step_days: 30
  min_rolling_positive_frac: 0.60
  min_recent_sharpe: 0.0       # 초과(>), 최근 12개월
  recent_days: 365
G5:
  min_dsr: 0.95                # 이상(>=)
  max_pbo: 0.30                # 미만(<)
  pbo_splits: 16
  cluster_threshold: 0.5       # 상관거리 sqrt((1-rho)/2) 절단 높이 (평균 rho >= 0.5 → 1 시도)
G6:
  min_sharpe: 0.0              # 초과(>), Val, conservative
  max_mdd: 0.20                # 이하(<=), primary(conservative) 비용 Val 최대낙폭 — 사용자 결정 2026-11-09 (b)
  min_stress_sharpe: 0.0       # 초과(>), stress 비용 Val Sharpe (stress 에서는 낙폭 크기 판정 안 함)
  max_stress_mdd: 0.20         # 구 규칙(legacy, float 입력 시에만 사용)
  max_mc_mdd95: 0.20           # 이하(<=), 거래당 몬테카를로 MDD 95백분위
  mc_sims: 10000
  # R1 옵션 (gate_review_20261110, 기본 = 현재 동작). 바꾸기 = 제안 + 사람 승인 → 다음 캠페인부터.
  stress_mode: 'off'           # sharpe = stress 비용 Val Sharpe > min_stress_sharpe 요구 | off = 계산·표시만 (② )
  drawdown_mode: size          # reject = 낙폭 초과 시 탈락 | size = 크기 조절: position_scale = min(1, max_mdd/ValMDD,
                               #   max_mc_mdd95/MCMDD95) ≥ min_position_scale 이면 낙폭 조건 통과 (②; 하한은 ③)
  min_position_scale: 0.25     # size 모드 크기 하한 (③ 위험 선호)
  size_includes_dev: false     # 자율 rs-001 옵션: 크기 계산에 Dev 최대낙폭도 넣음 (엄격화)
  worst_month_min: null        # 자율 rs-001 옵션: 최악 달력 월(Dev·Val, 운용 크기) 하한 (예 -0.08) → 크기 계산에 포함
  max_val_per_campaign: null   # 자율 rs-001 옵션: 캠페인당 Val 로 보내는 Dev 생존자 수 상한 (Val 예산 절약)
  # Val 사용 원장 + 누적 Holm (PLAN §10b-4, §5.3 잠금 규칙과 같은 구조). 후보마다 Val 평가 *전에*
  # 원장 val_evaluations 에 기록(k번째 사용). 통계량 = primary 비용 Val 일간 수익 평균 > 0 의
  # 정상 블록 부트스트랩 단측 p (inference.bootstrap_mean_test). 기존 G6 조건에 더해 이 p 가
  # 이 Val(val_id) 의 이전 모든 사용 p 와 함께 Holm(alpha, mode) 을 통과해야 G6 통과.
  # 같은 logic_hash 는 Val 을 한 번만 쓴다(재실행은 이전 결정 재사용). cap 회 사용 후 Val 롤링(사람).
  val_budget:
    alpha: 0.10
    holm_mode: cumulative      # G7 과 같은 의미 (cap: m=cap 고정 | cumulative: m=k)
    cap: 20                    # 20회 사용 시 Val 은퇴 → dev 편입, 새 Val 필요 (val_id 는 splits.yaml 의 val_id, 없으면 구간 경계로 생성)
    n_boot: 2000
    seed: 0
    # Val 증거 규칙 (R1 옵션, 기본 holm = 현재 동작). 사용 기록(k)·상한(cap)·재사용 규칙은 모든 방식에서 같다.
    #   holm = 위 누적 Holm | fixed = p ≤ fixed_p (다중성 보정 없음) |
    #   combined = Dev DSR 의 z 와 Val z = Φ⁻¹(1−p) 의 Stouffer 결합 (z_dev+z_val)/√2: 결합 p ≤ combined_alpha 그리고 Val Sharpe > 0
    evidence: combined
    fixed_p: 0.05
    combined_alpha: 0.05
# 노출 인식 관문 변형 (PLAN D14 초안 — 사람 승인 전, 기본 OFF; docs/PARAMS.md §6). 전부 class ② (config/params.yaml).
# enabled: false 인 동안 G4/G6 판정은 위의 기존 규칙 그대로다. 파이프라인은 변형 결과를 정보(shadow)로만 기록한다.
# 켜기 = class ② 기준 변경(btc_quant.params.criteria, 합성 보정 근거만) + 사람 승인 → 승인 이후 등록되는 캠페인부터.
# 변형은 기존 규칙의 상위 집합이다(기존 통과 = 변형 통과). 엣지 증거(G1·G2·G3·G5)와 잠금(G7)·전진(G8)은 그대로.
exposure_aware:
  enabled: false               # 주 스위치
  min_dev_exposure: 0.20       # 남용 방지: Dev exposure_days(포지션이 있던 날 비율) ≥ 이 값일 때만 변형 적용
  G4:
    enabled: true              # 주 스위치가 켜졌을 때 G4 변형 사용
    neutral_max_exposure: 0.10 # 롤링 창 exposure_days < 이 값 → '중립'(쉬는 창): 양수 비율 분모에서 제외
    min_active_windows: 20     # 비중립 창 ≥ 이 수 (Dev 4.8년 ≈ 53창). 미달이면 변형 불가(기존 규칙만)
  G6:
    enabled: true              # 주 스위치가 켜졌을 때 G6 '쉬어서 피함' 경로 사용
    flat_max_exposure: 0.25    # Val exposure_days ≤ 이 값 = 대체로 쉼
    flat_min_return: -0.02     # Val 총수익(primary 비용) ≥ 이 값 (돈을 잃지 않음, 작은 허용치)
    flat_min_stress_return: -0.04  # Val 총수익(stress 비용) ≥ 이 값 (stress Sharpe>0 대신)
    flat_max_mdd_vs_bh: 0.5    # Val MDD ≤ 이 배수 × 같은 기간 B&H MDD
    flat_require_bh_down: true # 같은 기간 B&H 총수익 < 0 일 때만 (상승장을 놓친 것은 '피함'이 아님)
    flat_min_trades: 10        # Val 거래 < 이 수면 'insufficient_evidence' (통과 아님)
# 관문 프로필 (Phase 5). 템플릿 `gate_profile: managed_hold` 인 캠페인만 이 규칙으로 판정(기본 프로필 불변).
# 모든 증거 = 동일 비중 B&H 대비 능동 일간 수익. 근거 research/reports/managed_hold_profile_20261110.md (합성만).
profiles:
  managed_hold:
    enabled: true              # 켜기 = class ② 승인, 다음 캠페인부터
    min_switches: 30           # G1 풀링 전환(진입) 수
    min_dev_days: 365          # G1 Dev 일수
    g2_null_runs: 500          # G2 타이밍 귀무(노출 상태열 원형 이동) 반복 수
    g2_top_fraction: 0.05      # G2 귀무 상위 비율
    g2_min_shift_days: 30      # G2 최소 이동 일수
    g3_neighbor_ratio: 0.25    # G3 인접 능동 Sharpe 중앙값 / 선택
    g4_window_days: 182        # G4 롤링 창
    g4_step_days: 30
    g4_min_frac: 0.5           # G4 능동 수익 ≥ 0 창 비율
    g5_min_dsr: 0.9            # G5 능동 수익 DSR
    g6_combined_alpha: 0.05    # G6 Dev 능동 DSR z + Val 능동 p 결합
    g8_min_weeks: 8            # G8 페이퍼 기간 (구현 예정)
    g8_min_state_match: 0.95   # G8 백테스트 노출 상태 일치율 (구현 예정)
# 후보 선택 (PLAN §10b-4): 캠페인 수익 행렬의 상관 군집별 최고(primary 가중 Sharpe) 1개 → 그 중 상위 K.
selection:
  method: cluster_best         # cluster_best | top_sharpe(구 방식)
  cluster_threshold: 0.5       # selection.correlation_clusters 절단 높이 (G5 와 같은 값)
G7:
  alpha: 0.10
  cap: 10                      # 10회 개봉 시 잠금 구간 은퇴
  holm_mode: cumulative        # 사용자 결정 2026-11-09 (cap: 보수적, 수명 FWER<=alpha | cumulative: 개봉 수 기준 Holm)
  # 잠금 판정 방식 (Phase 4 옵션, 기본 holm = 현재 동작; 바꾸기 = 사람 승인, research/reports/g7_design_20261110.md)
  #   holm | no_contradiction (잠금 Sharpe > 0) | combined (Dev+Val+잠금 Stouffer p ≤ combined_alpha, 잠금 Sharpe > 0)
  evidence: holm
  combined_alpha: 0.05
G8:
  min_paper_weeks: 3
  min_paper_trades: 30
  pnl_band: 0.90               # 손익이 백테스트 90% 구간 안
  # 전진 인큐베이션 (research/forward.py, PLAN §10b-5)
  forward_states: [validated, challenger]
  forward_warmup_days: 14      # Forward 시작 후 이 기간은 지표 워밍업만(거래·평가 없음). 잠금 구간 데이터로 워밍업하지 않는다.
  forward_exchanges: [coinone, upbit]   # 매일 REST 로 Forward 1분봉을 저장소에 추가하는 거래소
risk:
  daily_loss_floor: -0.03      # min(-3%, Val 일간 1백분위)
  weekly_loss_floor: -0.06     # min(-6%, Val 주간 1백분위)
  drawdown_floor: -0.12        # min(-12%, -(MC MDD95 × 1.2))
  drawdown_mc_mult: 1.2
  loss_percentile: 1
  min_max_trades_per_day: 5    # max(5, 3 × 일평균)
  trades_per_day_mult: 3
  data_stall_minutes: 2
  api_error_streak: 3
  price_anomaly_quantile: 0.999
# 견고성 묶음 기준 (PLAN §10b-7, research/robustness.py — 원래 코드 상수, 같은 값으로 이관 2026-11-09).
# class ② 증거 기준 (latency_delays_min 만 class ① 지연 측정치). 등급·근거는 config/params.yaml robustness.*.
robustness:
  latency_delays_min: [1]      # 실시간 체결 지연 시나리오(분). 1봉 지연은 봉 길이로 자동 추가
  latency_min_retention: 0.5   # Sharpe(지연)/Sharpe(기준) ≥ 0.5 (모든 시나리오)
  outlier_top_frac: 0.01       # 상위 1% 거래 제거 → Sharpe > 0
  outlier_top_n: 5             # 상위 5건 거래 제거 → Sharpe > 0
  loyo_min_days: 60            # 연도 제외 검사 대상 연도의 최소 일수
  cost_mults: [1.5, 2.0]       # 비용 +50%, +100% 시나리오
  cost_pass_mult: 1.5          # 이 배수에서 Sharpe > 0 이면 통과 (+100% 는 보고만)
  regime_lookback_days: 30     # 국면 특성 창(직전 30일, 인과)
  regime_max_pnl_share: 0.70   # 한 국면 손익 비중 > 70% 면 국면 의존
  regime_mode: pnl_share       # 국면 검사 판정 방식: pnl_share(위 비중 규칙, 현재) | dominant_alpha(비중 초과 시 지배 국면 안 노출-맞춤 B&H 대비 초과 ≥ 아래 값이면 통과) | informational(표시만)
  regime_dominant_min_excess: 0.0  # dominant_alpha 전용: 지배 국면 안 노출-맞춤 B&H 대비 연율 초과수익 하한
  alpha_min_tstat: 1.5         # 알파 t ≥ 2 (Newey–West)
  alpha_nw_lags: 5             # Newey–West 시차
  cross_venue_min_ratio: 0.5   # Sharpe(다른 거래소)/Sharpe(대상) ≥ 0.5, 다른 거래소 Sharpe > 0
  # 꼬리 위험 검사 'tail' (2026-11-10, 분할 매수 사다리·부분 사이징과 함께 추가, PLAN D16; D19).
  # tail_enabled: false = 정보 전용(flag 만 기록) | ladder = 분할 매수 사다리 스펙만 판정에 사용(그 밖은 정보 전용) | true = 모든 스펙.
  # 변경 = class ② 변경 + 사람 승인 (다음 캠페인부터).
  tail_enabled: ladder         # false | ladder | true
  tail_max_worst_day: 0.10     # 평가 기준(MTM) 최악 일 손실 ≤ 10% (자산 대비)
  tail_max_worst_week: 0.15    # MTM 최악 주(월~일) 손실 ≤ 15%
  tail_max_cvar5: 0.03         # MTM 일간 하위 5% 평균 손실 ≤ 3%
  tail_max_full_inventory_days: 30  # 최대 보유 비중에 연속으로 머문 최장 기간 ≤ 30일
  tail_min_bear_return: -0.20  # Dev 약세장 연도(2022) 총수익(실현 기준) ≥ −20%
