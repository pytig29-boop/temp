# 파라미터 레지스트리 — 모든 한도·임계값의 등급·근거·버전 (docs/PARAMS.md)
# class 1 = 시장 측정치(자동, 비대칭 규칙) · 2 = 증거 기준(합성 보정 제안 + 사람 승인, 다음 캠페인부터)
# · 3 = 위험 선호(사람 선택). 값은 source 가 가리키는 곳이 원본이며, 여기 value 와 다르면 drift 오류.
# 이 파일은 `python -m btc_quant.params` 가 갱신한다 — 손으로 고치지 말 것.
version: 1
settings:
  calibration:
    notional_krw: 300000
    quantiles:
      base: 0.5
      conservative: 0.9
      stress: 0.99
    stress_safety_factor: 1.5
    min_snapshots_per_hour: 60
    min_hours_provisional: 2
    min_snapshots_provisional: 300
    min_hours_final: 72
    min_kst_hours_final: 24
    min_days_final: 7
    provisional_ci: 0.95
    provisional_auto_apply_stricter: false
    tolerance_bps: 0.05
    n_boot: 2000
  risk_prefs:
    capital_fraction: null
uncatalogued_ok:
- version
- primary_metric.annualization
- G6.val_budget.seed
- G8.forward_states
- G8.forward_exchanges
