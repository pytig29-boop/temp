# 사용법 (저장소 루트에서):
#   cp deploy/.env.example deploy/.env   # 값 채우기
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f collector
name: btc-quant

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: btc-quant:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
    command: ["python", "-m", "btc_quant.live", "collect",
              "--exchanges", "${COLLECTOR_EXCHANGES:-coinone,upbit}",
              "--ob-interval", "${COLLECTOR_OB_INTERVAL:-1.0}",
              "--stale-seconds", "${COLLECTOR_STALE_SECONDS:-30}",
              "--flush-seconds", "${COLLECTOR_FLUSH_SECONDS:-300}",
              "--heartbeat", "/app/runtime/collector.heartbeat",
              "--gaps", "/app/runtime/collector_gaps.jsonl"]
    volumes:
      - ${BTCQ_DATA_DIR:-../data}:/app/data
      - ${BTCQ_RUNTIME_DIR:-../runtime}:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-m", "btc_quant.live", "healthcheck",
             "--heartbeat", "/app/runtime/collector.heartbeat",
             "--max-age", "90", "--max-data-age", "300"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s   # SIGTERM 후 버퍼 flush 시간
    logging: *logging
    mem_limit: 512m

  # 페이퍼 트레이딩: 레지스트리 active 1 + challenger ≤3 을 실시간 데이터로 운용 (docs/OPERATIONS.md §11)
  # 자체 WebSocket 연결을 쓰며 원천 데이터는 기록하지 않는다(기록은 collector 담당).
  paper:
    image: btc-quant:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      BTC_QUANT_ROOT: /app
    command: ["python", "-m", "btc_quant.paper", "run",
              "--runtime", "/app/runtime",
              "--registry-root", "/app",
              "--cost", "${PAPER_COST:-coinone_conservative}",
              "--notional", "${PAPER_NOTIONAL:-300000}",
              "--wait-for-strategies"]
    volumes:
      - ${BTCQ_RUNTIME_DIR:-../runtime}:/app/runtime
      - ${BTCQ_STRATEGIES_DIR:-../strategies}:/app/strategies:ro
      - ${BTCQ_RESEARCH_DIR:-../research}:/app/research:ro
    healthcheck:
      test: ["CMD", "python", "-m", "btc_quant.paper", "healthcheck",
             "--heartbeat", "/app/runtime/paper/service.heartbeat", "--max-age", "90"]
      interval: 30s
      timeout: 10s
      start_period: 180s     # REST 워밍업(최대 수십 초) + 첫 분 대기
      retries: 3
    stop_grace_period: 30s   # SIGTERM → 상태 저장 후 종료
    logging: *logging
    mem_limit: 1g
